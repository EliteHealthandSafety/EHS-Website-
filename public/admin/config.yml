# Decap CMS configuration
# NOTE: the GitHub backend needs an OAuth handler before login works.
# Set `base_url` (and `auth_endpoint`) to your OAuth provider once the site is deployed
# (a free Cloudflare Worker OAuth proxy is the usual choice). Everything else is ready.

backend:
  name: github
  repo: EliteHealthandSafety/EHS-Website-
  branch: main
  # base_url: https://your-oauth-worker.example.workers.dev   # TODO after deploy

# Uploaded images land alongside the existing blog images
media_folder: "public/images/blog"
public_folder: "/images/blog"

site_url: https://elitehealthandsafety.co.uk
display_url: https://elitehealthandsafety.co.uk

collections:
  - name: blog
    label: "Blog posts"
    label_singular: "Blog post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (SEO)", name: "description", widget: "text", required: false }
      - { label: "Publish date", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }
