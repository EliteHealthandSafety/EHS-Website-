name: Deploy to IONOS

# IONOS Deploy Now is unavailable, so this workflow is what puts the site live.
# It runs on every push to main, can be run by hand, and runs nightly so a price
# changed in the portal reaches the website without anyone touching the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC nightly — picks up portal price changes

concurrency:
  group: deploy-production      # never let two deploys overlap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild runs scripts/sync-pricing.mjs, so the build carries whatever
      # prices are currently set in the portal.
      - name: Build (syncs live pricing first)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run build

      - name: Sanity-check the build
        run: |
          set -e
          test -f dist/index.html
          test -f dist/.htaccess
          pages=$(find dist -name index.html | wc -l)
          echo "built $pages pages"
          [ "$pages" -ge 20 ] || { echo "::error::only $pages pages built — refusing to deploy"; exit 1; }

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Back up the current live site
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -e
             D="${{ secrets.DEPLOY_PATH }}"; B=/home/www/_backups; mkdir -p "$B"
             tar czf "$B/site-predeploy-$(date +%Y%m%d-%H%M%S).tar.gz" -C "$D" .
             # keep the 10 most recent, bin the rest
             ls -1t "$B"/site-predeploy-*.tar.gz | tail -n +11 | xargs -r rm --
             echo "backup done"'

      - name: Deploy
        run: |
          rsync -az --delete --checksum \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # Prove the site actually works, and roll back if it genuinely does not.
      # Each check retries with backoff so a single slow response from shared
      # hosting can no longer fail a good deploy — only a repeated, real failure
      # counts (and only that triggers the rollback below).
      - name: Verify live site
        id: verify
        run: |
          set -e
          BASE="https://elitehealthandsafety.co.uk"

          # Give the webspace a moment to settle after the sync before probing.
          sleep 8

          # Probe a path, retrying to ride out transient slowness. Follows
          # redirects (-L) and treats a curl error as code 000 → retry.
          check() {
            path="$1"; expect="$2"; code=000
            for attempt in 1 2 3 4 5; do
              code=$(curl -sL -o /dev/null --connect-timeout 10 --max-time 30 \
                       --retry 2 --retry-delay 2 --retry-connrefused \
                       -w "%{http_code}" "$BASE$path" || echo 000)
              if [ "$code" = "$expect" ]; then
                echo "  $path -> $code (attempt $attempt) ok"
                return 0
              fi
              echo "  $path -> $code (attempt $attempt) — retrying"
              sleep $((attempt * 5))
            done
            echo "::error::$path did not return $expect after 5 attempts (last: $code)"
            return 1
          }

          fail=0
          for p in / /pricing/ /compliance-checklist/ /contact-us/ /blog/ /services/; do
            check "$p" 200 || fail=1
          done

          # The lead-gen tool must never regress to the old email gate. Fetch with
          # retries so a transient empty response is not mistaken for a clean page
          # (only a page we actually received, containing the gate, is a failure).
          gate=""
          for attempt in 1 2 3; do
            gate=$(curl -sL --connect-timeout 10 --max-time 30 "$BASE/compliance-checklist/" || true)
            [ -n "$gate" ] && break
            sleep 5
          done
          if [ -n "$gate" ] && printf '%s' "$gate" | grep -q "Send me the checklist"; then
            echo "::error::checklist is gated again"; fail=1
          fi

          [ "$fail" = "0" ] || exit 1

      - name: Roll back if verification failed
        if: failure() && steps.verify.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'set -e
             D="${{ secrets.DEPLOY_PATH }}"; B=/home/www/_backups
             LATEST=$(ls -1t "$B"/site-predeploy-*.tar.gz | head -1)
             echo "rolling back to $LATEST"
             rm -rf "${D:?}"/* && tar xzf "$LATEST" -C "$D"'
          echo "::error::Deploy verification failed — site rolled back to the previous version."

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
