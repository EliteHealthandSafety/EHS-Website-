name: Portal → website drift

# Prompts a human when the portal has catalogue changes the website will NOT
# publish on its own (a new service that needs listing in pricing.js, or a code
# the site lists that the portal has dropped). Prices/flags are NOT structural —
# those flow automatically via sync-pricing, so they never appear here.
#
# It never touches the site or the deploy. On drift it opens/updates a GitHub
# issue (which emails you); when the drift is cleared it closes that issue.
on:
  schedule:
    - cron: '0 7 * * *'          # 07:00 UTC daily, after the 03:00 deploy sync
  workflow_dispatch:
  push:
    branches: [main]
    paths:                        # re-check promptly when the catalogue is edited
      - 'src/data/pricing.js'
      - 'scripts/check-catalogue.mjs'
      - '.github/workflows/catalogue-drift.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: catalogue-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies needed — the checker uses only Node built-ins + fetch.
      - name: Check portal → website drift
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/check-catalogue.mjs

      - name: Open, update or close the drift issue
        uses: actions/github-script@v7
        env:
          DRIFT: ${{ steps.check.outputs.drift_count }}
          REPORT: ${{ steps.check.outputs.report_md }}
        with:
          script: |
            const drift = parseInt(process.env.DRIFT || '0', 10);
            const report = process.env.REPORT || '';
            const TITLE = 'Portal → website: catalogue drift';
            const LABEL = 'catalogue-drift';
            const { owner, repo } = context.repo;

            const open = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL, per_page: 50,
            })).data.find((i) => i.title === TITLE);

            const stamp = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const body = `${report}\n\n<sub>Auto-generated by the catalogue-drift workflow · last checked ${stamp} UTC</sub>`;

            if (drift > 0) {
              if (open) {
                await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
                core.info(`Updated drift issue #${open.number} (${drift} item(s)).`);
              } else {
                const created = await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: [LABEL] });
                core.info(`Opened drift issue #${created.data.number} (${drift} item(s)).`);
              }
            } else if (open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.number,
                body: '✅ Resolved — the website catalogue now matches the portal. Closing automatically.',
              });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              core.info(`Closed drift issue #${open.number}.`);
            } else {
              core.info('No drift and no open issue — nothing to do.');
            }
